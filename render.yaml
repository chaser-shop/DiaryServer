services:
  - type: web
    name: navsstudents
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_NAMES
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 1grET3-MHCkBXqrBrHL1BIiUnAks0Kh3P4MuOijcPykY
      # Аркуш «101_СПД_2026». Попереднє значення «0» не існувало в таблиці.
      - key: GOOGLE_SHEET_GID
        value: "447170421"
      - key: GOOGLE_SHEET_GROUP
        value: 101 СПД
      - key: GOOGLE_SHEET_INTERVAL_MS
        value: "120000"
      # Потрібен лише для приватної таблиці; таблиця, відкрита за посиланням, читається без ключа.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
